<!doctype html>
<!-- Visual check of every spec in out/gallery.json; serve the repo root:
     python3 -m http.server -d . 8000, then open /tests/gallery.html -->
<html><head><meta charset="utf-8"><title>matgrib gallery</title>
<link rel="stylesheet" href="../_extensions/matgrib/matgrib.css">
<script src="../_extensions/matgrib/vendor/d3.min.js"></script>
<script src="../_extensions/matgrib/vendor/plot.umd.min.js"></script>
<style>body { font-family: Georgia, serif; max-width: 760px; margin: 2rem auto; } h4 { margin: 1.5rem 0 0.3rem; }</style>
</head><body>
<div id="out"></div>
<script>
fetch("out/gallery.json").then((r) => r.json()).then((items) => {
  const out = document.getElementById("out");
  for (const it of [].concat(items)) {
    const h = document.createElement("h4"); h.textContent = it.name; out.appendChild(h);
    const d = document.createElement("div"); d.className = "matgrib";
    const s = document.createElement("script"); s.type = "application/json"; s.textContent = JSON.stringify(it.spec);
    d.appendChild(s); out.appendChild(d);
  }
  const js = document.createElement("script"); js.src = "../_extensions/matgrib/matgrib.js"; document.body.appendChild(js);
});
</script></body></html>
